name: 3 - Auto-Fix Agent

# Runs after Self-Healing Deploy fails, or manually from the Actions tab.
# Uses Google Gemini API. Store the API key in the GEMINI_API_KEY repository secret.

on:
  workflow_run:
    workflows: ["Self-Healing Deploy"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: autofix
  cancel-in-progress: true

env:
  GEMINI_MODEL: gemini-3.8-flash

jobs:
  autofix:
    # For workflow_run, only process runs from this repository. This prevents
    # exposing the Gemini secret to code submitted from a fork.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      # On workflow_run, check out the trusted default branch so an untrusted
      # branch cannot replace autofix.py and steal secrets. On manual runs,
      # use the branch selected in the Actions UI.
      - name: Checkout trusted workflow code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      # Only copy the target HTML from the failed commit; do not execute scripts
      # from that commit. The job condition above excludes fork-originated runs.
      - name: Get target HTML from failed commit
        if: github.event_name == 'workflow_run'
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$FAILED_SHA"
          git checkout "$FAILED_SHA" -- index.html

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --quiet --upgrade "google-genai>=1.0.0"

      - name: Show Python and Gemini SDK versions
        run: |
          python --version
          python -c "import importlib.metadata; print('google-genai', importlib.metadata.version('google-genai'))"

      - name: Diagnose the failure and open a fix PR
        run: python .github/scripts/autofix.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_MODEL }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_FILE: index.html
          CHECKER: check-html.py
          BASE_BRANCH: main
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
